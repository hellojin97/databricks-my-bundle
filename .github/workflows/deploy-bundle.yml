name: deploy-bundle
on:
  push:
    branches: [ main ]
    tags: ["v*"]
    paths:
      - configuration/**
      - src/**
      - pyproject.toml
      - .github/**
      - databricks.yml
      - uv.lock

  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - dev
          - prd
        default: dev
        description: ""

permissions:
  id-token: write
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: https://adb-379336079866507.7.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_SP_CLIENT_ID }}
jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me

      - name: bundle validate (dev)
        id: validate
        run: |
          set +e
          databricks bundle validate -t dev 2>&1 | tee validate.log
          EXIT=${PIPESTATUS[0]}
          {
            echo 'log<<LOG_EOF'
            sed -E 's/\x1b\[[0-9;]*m//g' validate.log | tail -c 3500
            echo
            echo 'LOG_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: Notify validate failure
        if: ${{ failure() && steps.validate.outcome == 'failure' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          nodetail: true
          title: "🔴 Bundle validate failed (dev)"
          url: ${{ env.DATABRICKS_HOST }}
          description: |
            **dev** 타깃의 bundle 정의 검증에 실패했습니다. `databricks.yml` / `configuration/` / 변수 설정을 확인하세요.

            **error log (tail)**
            ```
            ${{ steps.validate.outputs.log }}
            ```

      - run: databricks bundle summary -t dev

      - name: bundle plan (before deploy)
        id: plan_before
        run: |
          set -o pipefail
          databricks bundle plan -t dev | tee plan_before.txt
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_before.txt)
          {
            echo 'plan<<PLAN_EOF'
            echo "$CLEAN" | head -c 3500
            echo
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify deploy starting
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          color: 0x3498db
          nodetail: true
          title: "🔵 Databricks bundle deploy starting (dev)"
          url: ${{ env.DATABRICKS_HOST }}
          description: |
            [Databricks workspace](${{ env.DATABRICKS_HOST }}) **dev** 타깃에 배포가 준비되었습니다.

            **plan**
            ```
            ${{ steps.plan_before.outputs.plan }}
            ```

      - name: bundle deploy (dev)
        id: deploy
        run: |
          set +e
          databricks bundle deploy -t dev 2>&1 | tee deploy.log
          EXIT=${PIPESTATUS[0]}
          {
            echo 'log<<LOG_EOF'
            sed -E 's/\x1b\[[0-9;]*m//g' deploy.log | tail -c 3500
            echo
            echo 'LOG_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: Notify deploy success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          nodetail: true
          title: "🟢 Databricks bundle deploy succeeded (dev)"
          url: ${{ env.DATABRICKS_HOST }}
          description: |
            [Databricks workspace](${{ env.DATABRICKS_HOST }}) **dev** 타깃에 배포가 완료되었습니다.

      - name: bundle plan (after deploy) + drift detection
        id: plan_after
        run: |
          set -o pipefail
          databricks bundle plan -t dev | tee plan_after.txt
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_after.txt)
          if echo "$CLEAN" | grep -qiE 'no changes|0 to (add|change|delete)'; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo 'plan<<PLAN_EOF'
              echo "$CLEAN" | head -c 3500
              echo
              echo 'PLAN_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Notify drift detected
        if: steps.plan_after.outputs.drift == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          color: 0xff9900
          nodetail: true
          title: "🟠 Bundle drift detected after deploy (dev)"
          url: ${{ env.DATABRICKS_HOST }}
          description: |
            [Databricks workspace](${{ env.DATABRICKS_HOST }}) **dev** 배포는 성공했으나 직후 plan이 0 changes가 아닙니다. 수렴 확인 필요.

            **plan (after deploy)**
            ```
            ${{ steps.plan_after.outputs.plan }}
            ```

      - name: Notify job failure
        if: ${{ failure() && steps.validate.outcome != 'failure' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          nodetail: true
          title: "🔴 Bundle deploy failed (dev)"
          url: ${{ env.DATABRICKS_HOST }}
          description: |
            [Databricks workspace](${{ env.DATABRICKS_HOST }}) **dev** 타깃 배포가 실패했습니다.

            **deploy log (tail)**
            ```
            ${{ steps.deploy.outputs.log }}
            ```

  deploy_prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t prd
      - run: databricks bundle summary -t prd
      - run: databricks bundle plan -t prd
      - run: databricks bundle deploy -t prd
      - run: databricks bundle plan -t prd