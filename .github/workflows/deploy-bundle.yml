name: deploy-bundle
on:
  push:
    branches: [ main ]
    tags: ["v*"]
    paths:
      - configuration/**
      - src/**
      - pyproject.toml
      - .github/**
      - databricks.yml
      - uv.lock
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - dev
          - prd
        default: dev
        description: ""

permissions:
  id-token: write
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: https://adb-7405613177889652.12.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_SP_CLIENT_ID }}
jobs:
  deploy_dev:
    concurrency:
      group: databricks-deploy-dev
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6  # artifacts(ecommerce_wheel) 빌드용 `uv build`
      - uses: databricks/setup-cli@main
      - run: databricks current-user me

      - name: bundle validate (dev)
        run: |
          set +e
          databricks bundle validate -t dev 2>&1 | tee validate.log
          EXIT=${PIPESTATUS[0]}
          {
            echo "## validate"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' validate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - run: databricks bundle summary -t dev

      - name: bundle plan (before deploy)
        id: plan_before
        run: |
          set +e
          databricks bundle plan -t dev 2>&1 | tee plan_before.txt
          EXIT=${PIPESTATUS[0]}
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_before.txt)
          {
            echo "## plan (before deploy)"
            echo '```'
            echo "$CLEAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          NL=$'\n'
          SUMMARY=$(echo "$CLEAN" | grep -E "^Plan:" | tail -1 | sed -E 's/^Plan: //; s/, [0-9]+ unchanged$//')
          RESOURCES=$(echo "$CLEAN" | grep -E "^(create|update|delete) " | head -5 | sed 's/^/  - /')
          TOTAL=$(echo "$CLEAN" | grep -cE "^(create|update|delete) " || true)
          if [ "${TOTAL:-0}" -gt 5 ]; then
            RESOURCES="${RESOURCES}${NL}  - ... and $((TOTAL - 5)) more"
          fi

          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          {
            echo "resources<<RES_EOF"
            echo "$RESOURCES"
            echo "RES_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: bundle deploy (dev)
        run: |
          set +e
          databricks bundle deploy -t dev --force-lock --auto-approve 2>&1 | tee deploy.log
          EXIT=${PIPESTATUS[0]}
          {
            echo "## deploy"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: bundle plan (after deploy) + drift detection
        id: drift
        run: |
          set +e
          databricks bundle plan -t dev 2>&1 | tee plan_after.txt
          EXIT=${PIPESTATUS[0]}
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_after.txt)
          {
            echo "## plan (after deploy)"
            echo '```'
            echo "$CLEAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $EXIT -eq 0 ]; then
            if echo "$CLEAN" | grep -qiE 'no changes|0 to (add|change|delete)'; then
              echo "detected=false" >> "$GITHUB_OUTPUT"
            else
              echo "detected=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit $EXIT

      - name: Compute notification fields
        if: always()
        id: notify
        env:
          JOB_STATUS: ${{ job.status }}
          DRIFT: ${{ steps.drift.outputs.detected }}
          PLAN_SUMMARY: ${{ steps.plan_before.outputs.summary }}
          PLAN_RESOURCES: ${{ steps.plan_before.outputs.resources }}
        run: |
          case "$DRIFT" in
            true)  DRIFT_TEXT="⚠️ 감지됨 — 직후 plan이 0 changes 아님" ;;
            false) DRIFT_TEXT="없음" ;;
            *)     DRIFT_TEXT="— (확인 안 됨)" ;;
          esac
          echo "drift_text=$DRIFT_TEXT" >> "$GITHUB_OUTPUT"

          NL=$'\n'
          if [ -z "$PLAN_SUMMARY" ]; then
            CHANGES_SECTION="- **변경**: — (확인 안 됨)"
          elif echo "$PLAN_SUMMARY" | grep -qE "^0 to add, 0 to change, 0 to delete$"; then
            CHANGES_SECTION="- **변경**: 없음"
          elif [ -n "$PLAN_RESOURCES" ]; then
            CHANGES_SECTION="- **변경**: ${PLAN_SUMMARY}${NL}${PLAN_RESOURCES}"
          else
            CHANGES_SECTION="- **변경**: $PLAN_SUMMARY"
          fi
          {
            echo "changes_section<<CS_EOF"
            echo "$CHANGES_SECTION"
            echo "CS_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$JOB_STATUS" = "success" ] && [ "$DRIFT" = "true" ]; then
            echo "title=🟠 Bundle deploy succeeded, drift detected (dev)" >> "$GITHUB_OUTPUT"
            echo "color=0xff9900" >> "$GITHUB_OUTPUT"
          elif [ "$JOB_STATUS" = "success" ]; then
            echo "title=🟢 Bundle deploy succeeded (dev)" >> "$GITHUB_OUTPUT"
            echo "color=0x2ecc71" >> "$GITHUB_OUTPUT"
          elif [ "$JOB_STATUS" = "failure" ]; then
            echo "title=🔴 Bundle deploy failed (dev)" >> "$GITHUB_OUTPUT"
            echo "color=0xe74c3c" >> "$GITHUB_OUTPUT"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            echo "title=⚪ Bundle deploy cancelled (dev)" >> "$GITHUB_OUTPUT"
            echo "color=0x95a5a6" >> "$GITHUB_OUTPUT"
          else
            echo "title=❓ Bundle deploy - unknown status (dev)" >> "$GITHUB_OUTPUT"
            echo "color=0x7f8c8d" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          noprefix: true
          title: ${{ steps.notify.outputs.title }}
          color: ${{ steps.notify.outputs.color }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: |
            - **환경**: `dev`
            ${{ steps.notify.outputs.changes_section }}
            - **Drift**: ${{ steps.notify.outputs.drift_text }}
            - **로그**: [Job Summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 참고

            🔗 [Databricks workspace](${{ env.DATABRICKS_HOST }})

  deploy_prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6  # artifacts(ecommerce_wheel) 빌드용 `uv build`
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t prd
      - run: databricks bundle summary -t prd
      - run: databricks bundle plan -t prd
      - run: databricks bundle deploy -t prd
      - run: databricks bundle plan -t prd