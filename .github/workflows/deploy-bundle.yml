name: deploy-bundle
on:
  push:
    branches: [ main ]
    tags: ["v*"]
    paths:
      - configuration/**
      - src/**
      - pyproject.toml
      - .github/**
      - databricks.yml
      - uv.lock

  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - dev
          - prd
        default: dev
        description: ""

permissions:
  id-token: write
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: https://adb-379336079866507.7.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_SP_CLIENT_ID }}
jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t dev
      - run: databricks bundle summary -t dev
      - run: databricks bundle plan -t dev
      - run: databricks bundle deploy -t dev
      - run: databricks bundle plan -t dev

  deploy_prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t prd
      - run: databricks bundle summary -t prd
      - run: databricks bundle plan -t prd
      - run: databricks bundle deploy -t prd
      - run: databricks bundle plan -t prd