name: deploy-bundle
on:
  push:
    branches: [ main ]
    tags: ["v*"]
    paths:
      - configuration/**
      - src/**
      - pyproject.toml
      - .github/**
      - databricks.yml
      - uv.lock

  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - dev
          - prd
        default: dev
        description: ""

permissions:
  id-token: write
  contents: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: https://adb-379336079866507.7.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_SP_CLIENT_ID }}
jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t dev
      - run: databricks bundle summary -t dev

      - name: bundle plan (before deploy)
        id: plan_before
        run: |
          set -o pipefail
          databricks bundle plan -t dev | tee plan_before.txt
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_before.txt)
          {
            echo 'plan<<PLAN_EOF'
            echo "$CLEAN" | head -c 3500
            echo
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify deploy starting
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          color: 0x3498db
          title: "Databricks bundle deploy starting (dev)"
          description: |
            ref: `${{ github.ref_name }}`
            commit: `${{ github.sha }}`

            **plan**
            ```
            ${{ steps.plan_before.outputs.plan }}
            ```

      - run: databricks bundle deploy -t dev

      - name: Notify deploy success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Databricks bundle deploy succeeded (dev)"
          description: |
            ref: `${{ github.ref_name }}`
            commit: `${{ github.sha }}`

      - name: bundle plan (after deploy) + drift detection
        id: plan_after
        run: |
          set -o pipefail
          databricks bundle plan -t dev | tee plan_after.txt
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_after.txt)
          if echo "$CLEAN" | grep -qiE 'no changes|0 to (add|change|delete)'; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo 'plan<<PLAN_EOF'
              echo "$CLEAN" | head -c 3500
              echo
              echo 'PLAN_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Notify drift detected
        if: steps.plan_after.outputs.drift == 'true'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          color: 0xff9900
          title: "Bundle drift detected after deploy (dev)"
          description: |
            deploy는 성공했으나 after-plan이 0 changes가 아닙니다.
            ```
            ${{ steps.plan_after.outputs.plan }}
            ```

      - name: Notify job failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Bundle deploy failed (dev)"
          description: |
            ref: `${{ github.ref_name }}`
            commit: `${{ github.sha }}`

  deploy_prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v6
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t prd
      - run: databricks bundle summary -t prd
      - run: databricks bundle plan -t prd
      - run: databricks bundle deploy -t prd
      - run: databricks bundle plan -t prd