name: deploy-bundle
on:
  push:
    branches: [ main ]
    tags: ["v*"]
    paths:
      - configuration/**
      - src/**
      - pyproject.toml
      - .github/**
      - databricks.yml
      - uv.lock
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options:
          - dev
          - prd
        default: dev
        description: ""

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  DATABRICKS_AUTH_TYPE: github-oidc
  DATABRICKS_HOST: https://adb-7405613177889652.12.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_SP_CLIENT_ID }}
jobs:
  deploy_dev:
    concurrency:
      group: databricks-deploy-dev
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6  # artifacts(ecommerce_wheel) 빌드용 `uv build`
      - uses: databricks/setup-cli@main
      - run: databricks current-user me

      - name: bundle validate (dev)
        run: |
          set +e
          databricks bundle validate -t dev 2>&1 | tee validate.log
          EXIT=${PIPESTATUS[0]}
          {
            echo "## validate"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' validate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - run: databricks bundle summary -t dev

      - name: bundle plan (before deploy)
        id: plan_before
        run: |
          set +e
          databricks bundle plan -t dev 2>&1 | tee plan_before.txt
          EXIT=${PIPESTATUS[0]}
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_before.txt)
          {
            echo "## plan (before deploy)"
            echo '```'
            echo "$CLEAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          NL=$'\n'
          SUMMARY=$(echo "$CLEAN" | grep -E "^Plan:" | tail -1 | sed -E 's/^Plan: //; s/, [0-9]+ unchanged$//')
          RESOURCES=$(echo "$CLEAN" | grep -E "^(create|update|delete) " | head -5 | sed 's/^/  - /')
          TOTAL=$(echo "$CLEAN" | grep -cE "^(create|update|delete) " || true)
          if [ "${TOTAL:-0}" -gt 5 ]; then
            RESOURCES="${RESOURCES}${NL}  - ... and $((TOTAL - 5)) more"
          fi

          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          {
            echo "resources<<RES_EOF"
            echo "$RESOURCES"
            echo "RES_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $EXIT

      - name: bundle deploy (dev)
        run: |
          set +e
          databricks bundle deploy -t dev --force-lock --auto-approve 2>&1 | tee deploy.log
          EXIT=${PIPESTATUS[0]}
          {
            echo "## deploy"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' deploy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

      - name: bundle plan (after deploy) + drift detection
        id: drift
        run: |
          set +e
          databricks bundle plan -t dev 2>&1 | tee plan_after.txt
          EXIT=${PIPESTATUS[0]}
          CLEAN=$(sed -E 's/\x1b\[[0-9;]*m//g' plan_after.txt)
          {
            echo "## plan (after deploy)"
            echo '```'
            echo "$CLEAN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $EXIT -eq 0 ]; then
            if echo "$CLEAN" | grep -qiE 'no changes|0 to (add|change|delete)'; then
              echo "detected=false" >> "$GITHUB_OUTPUT"
            else
              echo "detected=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit $EXIT

      - name: Build Slack messages
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DRIFT: ${{ steps.drift.outputs.detected }}
          PLAN_SUMMARY: ${{ steps.plan_before.outputs.summary }}
          PLAN_RESOURCES: ${{ steps.plan_before.outputs.resources }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$DRIFT" in
            true)  DRIFT_TEXT="⚠️ 감지됨 — 직후 plan이 0 changes 아님" ;;
            false) DRIFT_TEXT="없음" ;;
            *)     DRIFT_TEXT="— (확인 안 됨)" ;;
          esac

          NL=$'\n'
          if [ -z "$PLAN_SUMMARY" ]; then
            CHANGES_SECTION="*변경*: — (확인 안 됨)"
          elif echo "$PLAN_SUMMARY" | grep -qE "^0 to add, 0 to change, 0 to delete$"; then
            CHANGES_SECTION="*변경*: 없음"
          elif [ -n "$PLAN_RESOURCES" ]; then
            CHANGES_SECTION="*변경*: ${PLAN_SUMMARY}${NL}${PLAN_RESOURCES}"
          else
            CHANGES_SECTION="*변경*: $PLAN_SUMMARY"
          fi

          if [ "$JOB_STATUS" = "success" ] && [ "$DRIFT" = "true" ]; then
            TITLE="🟠 Bundle deploy succeeded, drift detected (dev)"; COLOR="#ff9900"
          elif [ "$JOB_STATUS" = "success" ]; then
            TITLE="🟢 Bundle deploy succeeded (dev)"; COLOR="#2ecc71"
          elif [ "$JOB_STATUS" = "failure" ]; then
            TITLE="🔴 Bundle deploy failed (dev)"; COLOR="#e74c3c"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            TITLE="⚪ Bundle deploy cancelled (dev)"; COLOR="#95a5a6"
          else
            TITLE="❓ Bundle deploy - unknown status (dev)"; COLOR="#7f8c8d"
          fi

          # 레포명을 맨 위에 넣어, 하나의 토큰을 여러 repo가 공유해도 출처를 구분
          HEAD="*${REPO}*${NL}${TITLE}"
          TEXT="*환경*: \`dev\`${NL}${CHANGES_SECTION}${NL}*Drift*: ${DRIFT_TEXT}${NL}<${RUN_URL}|Job 로그> · <${DATABRICKS_HOST}|Databricks workspace>"
          CTX="브랜치 \`${REF}\` · 실행자 ${ACTOR} · run #${RUN_NUMBER}"

          # 메인 메시지 (chat.postMessage용; channel 포함)
          jq -n --arg ch "$CHANNEL_ID" --arg color "$COLOR" --arg head "$HEAD" \
                --arg text "$TEXT" --arg ctx "$CTX" --arg fb "$TITLE" \
            '{channel:$ch, text:$fb, attachments:[{color:$color,blocks:[
               {type:"section",text:{type:"mrkdwn",text:$head}},
               {type:"section",text:{type:"mrkdwn",text:$text}},
               {type:"context",elements:[{type:"mrkdwn",text:$ctx}]}
             ]}]}' > slack_main.json

          # 스레드 본문: main 머지 PR이면 그 PR 내용, 아니면 push 커밋 메시지
          PR_NUMBER=$(printf '%s' "$COMMIT_MSG" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -n "$PR_NUMBER" ]; then
            PR_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" || echo '{}')
            PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title // ""')
            PR_BODY=$(printf '%s' "$PR_JSON" | jq -r '.body // ""')
            THREAD_HEAD="📦 *머지된 PR* <${SERVER_URL}/${REPO}/pull/${PR_NUMBER}|#${PR_NUMBER}: ${PR_TITLE}>"
            THREAD_BODY="$PR_BODY"
          else
            SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
            THREAD_HEAD="📝 *커밋* \`${SHORT_SHA}\` by ${ACTOR}"
            THREAD_BODY="$COMMIT_MSG"
            [ -z "$THREAD_BODY" ] && THREAD_BODY="(커밋 메시지 없음 — 수동 실행)"
          fi

          # 본문은 jq에서 UTF-8 안전하게 1800자로 절단
          jq -n --arg ch "$CHANNEL_ID" --arg head "$THREAD_HEAD" --arg body "$THREAD_BODY" \
            '{channel:$ch, text: ($head + "\n\n" + (if ($body|length) > 1800 then ($body[0:1800] + "…") else $body end))}' \
            > slack_thread_body.json

      - name: Post Slack (main + thread reply)
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN 미설정 — Slack 알림을 건너뜁니다."
            exit 0
          fi
          api() {
            curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @"$1"
          }
          # 1) 메인 상태 메시지 → ts 획득
          RESP=$(api slack_main.json)
          if [ "$(printf '%s' "$RESP" | jq -r '.ok')" != "true" ]; then
            echo "Slack 메인 메시지 실패: $RESP"; exit 1
          fi
          TS=$(printf '%s' "$RESP" | jq -r '.ts')
          echo "메인 메시지 ts=$TS"
          # 2) 그 ts 스레드에 커밋/PR 내용을 답글로
          jq --arg ts "$TS" '. + {thread_ts:$ts}' slack_thread_body.json > slack_thread.json
          RESP2=$(api slack_thread.json)
          if [ "$(printf '%s' "$RESP2" | jq -r '.ok')" != "true" ]; then
            echo "Slack 스레드 답글 실패: $RESP2"; exit 1
          fi
          echo "Slack 알림 완료 (스레드 댓글 포함)"

  deploy_prd:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6  # artifacts(ecommerce_wheel) 빌드용 `uv build`
      - uses: databricks/setup-cli@main
      - run: databricks current-user me
      - run: databricks bundle validate -t prd
      - run: databricks bundle summary -t prd
      - run: databricks bundle plan -t prd
      - run: databricks bundle deploy -t prd
      - run: databricks bundle plan -t prd