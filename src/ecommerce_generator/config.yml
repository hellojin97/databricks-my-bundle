# 데이터 생성 설정 (선택 인자의 기본값)
# period, output 경로는 필수 CLI 인자(--start-date/--end-date/--output-volume)로 받는다.
# 아래 값들은 CLI에서 미지정한 선택 인자의 기본값으로만 쓰인다.

seed: 42

volumes:
  users: 100000
  products: 10000
  # 다음 phase에서 사용할 것 (참고용)
  orders: 3000000
  events: 30000000


# 더러운 데이터 주입 비율 (실전 느낌)
dirty_data:
  null_rate_gender: 0.05  # 5% 유저는 성별 NULL
  null_rate_brand: 0.02   # 2% 상품은 브랜드 NULL
  discontinued_rate: 0.12 # 12% 상품 단종