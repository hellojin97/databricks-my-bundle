# $schema: ../../bundle_config_schema.json
resources:
  catalogs:
    home-catalog:
      name: dataplay_home
      grants:
        - principal: "DATAPLAY_MANAGER"
          privileges:
            - ALL_PRIVILEGES
            - MANAGE
        - principal: "account users"
          privileges:
            - USE_CATALOG

  schemas:
    lib-schema:
      catalog_name: ${resources.catalogs.home-catalog.name}
      name: libs
      grants:
        - principal: "account users"
          privileges:
            - USE_SCHEMA
  volumes:
    whl-volume:
      catalog_name: ${resources.catalogs.home-catalog.name}
      schema_name: ${resources.schemas.lib-schema.name}
      name: wheels
      volume_type: MANAGED
      grants:
        - principal: "account users"
          privileges:
            - READ_VOLUME