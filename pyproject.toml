[project]
name = "ecommerce-generator"
version = "0.1.0"
description = "E-commerce fake data generator packaged as a wheel for Databricks bundle deployment"
readme = "README.md"
authors = [
    { name = "김현진", email = "pj.dbx.hjkim@kepartner.com" }
]
requires-python = ">=3.12,<3.13"
# wheel 런타임 의존성 (Databricks 클러스터에 라이브러리로 설치됨)
# numpy 하한은 DBR 내장본 재사용을 위해 낮게 유지. 파티션 쓰기는 polars 네이티브라 pyarrow 불필요.
dependencies = [
    "numpy>=1.26",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
# python_wheel_task / 콘솔 스크립트 진입점
generate-data = "ecommerce_generator.main:main"

# 로컬 개발 전용 (wheel 런타임 의존성에는 포함되지 않음)
[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"
