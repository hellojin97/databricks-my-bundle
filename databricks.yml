# $schema: ./bundle_config_schema.json
bundle:
  name: hj-krc-dabs
  engine: direct

include:
  - ./configuration/*/*.yml
  - ./configuration/*.yml

permissions:
  - group_name: ${var.service_principal_name}
    level: CAN_MANAGE
  - group_name: "Databricks_JIN_ADMIN"
    level: CAN_MANAGE

targets:
  dev:
    default: true
    mode: development