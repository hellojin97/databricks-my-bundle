# $schema: ./bundle_config_schema.json
bundle:
  name: hj-krc-dabs
  engine: direct

include:
  - ./configuration/*/*.yml
  - ./configuration/*.yml

# ecommerce_generator 패키지를 wheel로 빌드 (deploy 시 `build` 명령 실행 후 업로드)
#artifacts:
#  ecommerce_wheel:
#    type: whl
#    build: uv build --wheel
#    path: .
#    dynamic_version: true

permissions:
  - service_principal_name: ${var.service_principal_name}
    level: CAN_MANAGE
  - group_name: "DATAPLAY_MANAGER"
    level: CAN_MANAGE
#  - group_name: "IN4U-Admin"
#    level: CAN_MANAGE

targets:
  dev:
    default: true
    cluster_id: ${resources.clusters.main_cluster_apcmp.id}
    workspace:
      root_path: /Workspace/DABS/DATAPLAY_HOME
      artifact_path: /Volumes/dataplay_home/libs/wheels